name: Desktop packages
on:
  workflow_dispatch:
  push:
    branches:
      - lucnvm
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Server integration tests (Windows)
        run: python scripts/desktop.py test
      - name: Update verification tests
        run: |
          openssl version
          python scripts/desktop.py updater-test
          python tests/update_release_test.py
      - name: Build Windows app with bundled Java runtime
        run: python scripts/desktop.py package client --type app-image
      - name: Create update archive
        run: python scripts/update-release.py archive
      - uses: actions/upload-artifact@v4
        with:
          name: DartsBattle-windows-x64
          path: dist/updates/DartsBattle-windows.zip
          if-no-files-found: error
