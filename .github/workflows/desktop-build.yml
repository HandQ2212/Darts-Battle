name: Desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac-native
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integration tests
        run: python scripts/desktop.py test
      - name: Build desktop app with bundled Java runtime
        run: python scripts/desktop.py package client --type app-image
      - name: Make macOS installer
        if: runner.os == 'macOS'
        run: python scripts/desktop.py package client --type dmg
      - name: Archive app image (preserves launchers and permissions)
        shell: python
        run: |
          import pathlib, platform, shutil
          folder = pathlib.Path('dist') / (platform.system().lower() + '-' + platform.machine())
          shutil.make_archive('dist/DartsBattle-${{ matrix.name }}', 'zip', folder)
      - uses: actions/upload-artifact@v4
        with:
          name: DartsBattle-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/**/*.dmg
